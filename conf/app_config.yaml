# 小说创作智能体系统 — 应用配置文件
# 非敏感的基础设施配置，API密钥等敏感信息通过 .env 管理

app:
  name: "wangwen-creat"
  version: "0.1.0"

# ═══════════════════════════════════════════════════════
# 模型池：预定义多个可用的模型槽位
# 每个槽位 = 供应商 + 型号 + 端点 + 密钥来源
# 支持不同供应商，也支持同一供应商的不同型号（如 deepseek flash / pro）
# ═══════════════════════════════════════════════════════
models:
  deepseek_pro:
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY

  deepseek_flash:
    provider: deepseek
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY

  # 示例：另一个供应商（阿里百炼）
  # qwen_plus:
  #   provider: openai
  #   model: qwen-plus
  #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   api_key_env: DASHSCOPE_API_KEY

  # 示例：本地 Ollama
  # ollama_qwen:
  #   provider: openai
  #   model: qwen2.5:72b
  #   base_url: http://localhost:11434/v1
  #   api_key_env: OLLAMA_API_KEY

# ═══════════════════════════════════════════════════════
# 智能体 → 模型槽位 映射
# 每个智能体可独立指定使用哪个模型槽位
# ═══════════════════════════════════════════════════════
agents:
  supervisor:
    model: deepseek_pro        # 总编：用 pro（决策稳定，需强推理）
  architect:
    model: deepseek_pro        # 大纲设计师：用 pro（创意需要强模型）
  writer:
    model: deepseek_flash      # 章节撰写者：用 flash（长文本生成速度快）
  editor:
    model: deepseek_flash      # 编辑：用 flash（审核任务较轻，省成本）
  reader:
    model: deepseek_flash      # 读者：用 flash（一致性检查较轻）

memory:
  long_term:
    db_type: "sqlite"
    db_path: "data/novels.db"
  short_term:
    db_type: "sqlite"
    db_path: ":memory:"
  vector:
    db_type: "chromadb"
    persist_dir: "data/vector_db/"

logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {name}:{function}:{line} | {message}"
  rotation: "10 MB"
  retention: "7 days"

workflow:
  max_retries: 3
  max_chapter_length: 10000
  checkpoint_thread_prefix: "novel_creation"
